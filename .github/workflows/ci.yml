name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.11'
      - name: Synthetic macOS cache tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s macos -p 'test*.py'
